[package]
name = "codegen"
version = "0.1.0"
edition = "2024"

[dependencies]
proc-macro2 = "1"
serde = { version = "1.0.227", features = ["derive"] }
serde_json = "1.0.145"
quote = "1"
ir = { path = "../ir" }
runtime = { path = "../runtime"}

[dev-dependencies]
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"

[lib]
name = "codegen"
path = "src/lib.rs"
