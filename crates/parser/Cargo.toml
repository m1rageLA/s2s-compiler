[package]
name = "parser"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

swc_common = "15.0.0"
swc_ecma_ast = "16.0.0"
swc_ecma_parser = "25.0.0"
swc_ecma_transforms = "36.0.0"
swc_ecma_transforms_base = { version = "28.0.0", features = ["inline-helpers"] }
swc_ecma_compat_es2015 = "31.0.0"
swc_ecma_compat_common = "22.0.0"
swc_ecma_compat_es2016 = "28.0.0"
swc_ecma_compat_es2020 = "29.0.0"
swc_ecma_transforms_typescript = "31.0.0"
swc_ecma_visit = "16.0.0"
swc_ecma_transforms_compat = "32.0.0"
swc_ecma_codegen = "18.0.0"

[lib]
name = "parser"
path = "src/lib.rs"
