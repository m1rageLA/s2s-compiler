[package]
name = "compiler-entrypoint"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "compiler-entrypoint"
path = "main.rs"

[workspace]
members = ["crates/_compiler", "crates/codegen", "crates/logger", "crates/parser", "crates/schema", "crates/lowering"]
resolver = "3"

[dependencies]
compiler = { package = "_compiler", path = "crates/_compiler" }