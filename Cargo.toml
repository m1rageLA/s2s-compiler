[package]
name = "TS2RUST"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "src/parser",
    "src/ir",
    "src/codegen",
    "src/lowering",
    "src/runtime",
]
default-members = [
    ".",
    "src/parser",
    "src/ir",
    "src/codegen",
    "src/lowering",
    "src/runtime",
]

[dependencies]
lowering = { path = "src/lowering" }
parser = { path = "src/parser" }
ir = { path = "src/ir" }
codegen = { path = "src/codegen" }
runtime = { path = "src/runtime"}

quote = "1"
syn = { version = "2", features = ["full"] }
swc_ecma_ast = "15.0.0"


[dev-dependencies]
swc_ecma_parser = "24.0.1"
swc_common = "14.0.4"
swc_ecma_ast = "15.0.0"
