[workspace]
resolver = "2"
members = [
    "cli",
    "crates/core_api",
    "crates/parser",
    "crates/ir_types",
    "crates/codegen",
    "crates/lowering",
    "crates/runtime",
    "crates/node"
]
exclude = ["out"]

[workspace.dependencies]
napi = { version = "3.6.1", features = ["napi4"] }
napi-derive = "3.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.19.0", features = ["v4", "fast-rng"] }
napi-build = "2"
